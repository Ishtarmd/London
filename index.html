<title>Londres en ruta</title>

<style>
/* Layout: app de una pantalla tipo "línea de metro" — cabecera con días, línea de estaciones, tarjeta-postal, barra inferior Anterior/Siguiente */
:root{
  --bg:#eef1f6; --surface:#ffffff; --fg:#14182a; --muted:#5b6378; --line:#d9dee8; --chip:#e3e8f1;
  --ink-strong:#0d1530; --accent:#dc241f; --day:#dc241f;
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 10px 30px -14px rgba(16,24,48,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#151b30; --fg:#e8ecf6; --muted:#9aa3bb; --line:#262e48; --chip:#1f2741; --ink-strong:#ffffff; --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020; --surface:#151b30; --fg:#e8ecf6; --muted:#9aa3bb; --line:#262e48; --chip:#1f2741; --ink-strong:#ffffff; --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}

/* cabecera */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px}
.roundel{width:30px;height:30px;flex:none;position:relative}
.roundel i{position:absolute;inset:0;border:6px solid var(--accent);border-radius:50%}
.roundel b{position:absolute;left:-3px;right:-3px;top:50%;height:8px;margin-top:-4px;background:var(--ink-strong);border-radius:1px}
.brand h1{font-family:var(--font-display);font-stretch:85%;font-weight:850;font-size:22px;letter-spacing:-.01em;margin:0;color:var(--ink-strong)}
.brand .sub{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.2}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.days button{all:unset;cursor:pointer;text-align:center;padding:7px 4px 8px;border-radius:12px;background:var(--chip);color:var(--fg);border-bottom:4px solid transparent;transition:transform .15s}
.days button .w{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.days button .n{display:block;font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.1}
.days button[aria-selected="true"]{background:var(--d);color:#fff;border-bottom-color:rgba(0,0,0,.25)}
.days button[aria-selected="true"] .w{color:rgba(255,255,255,.85)}
.days button:focus-visible,.navbtn:focus-visible,.act:focus-visible,.stop:focus-visible{outline:3px solid var(--day);outline-offset:2px}

/* línea de estaciones */
.lineWrap{overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-block:6px 4px}
.lineWrap::-webkit-scrollbar{display:none}
.tube{position:relative;display:flex;gap:0;min-width:max-content;padding-inline:4px}
.tube:before{content:"";position:absolute;left:10px;right:10px;top:50%;height:6px;margin-top:-3px;background:var(--day);border-radius:3px;opacity:.9}
.stop{all:unset;cursor:pointer;position:relative;width:26px;height:22px;display:grid;place-items:center}
.stop span{width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--day);transition:transform .2s}
.stop.leg span{width:6px;height:6px;border-width:0;background:rgba(255,255,255,.85)}
.stop.done span{background:var(--day)}
.stop[aria-current="true"] span{transform:scale(1.55);background:#fff;box-shadow:0 0 0 3px var(--bg)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.meta b{color:var(--fg)}

/* tarjeta */
main{flex:1;padding-block:8px 120px}
.card{background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.post{position:relative;aspect-ratio:16/10;max-width:100%;color:#fff;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2))}
.post svg.scene{position:absolute;inset:0;width:100%;height:100%}
.post .time{position:absolute;left:14px;top:14px;font-family:var(--font-display);font-weight:800;font-size:15px;background:rgba(0,0,0,.28);backdrop-filter:blur(4px);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.post .cat{position:absolute;right:14px;top:14px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:999px}
.post .stamp{position:absolute;left:14px;bottom:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.9;font-weight:600}
.body{padding:18px 18px 20px}
.body h2{font-family:var(--font-display);font-stretch:90%;font-weight:850;font-size:27px;line-height:1.05;letter-spacing:-.015em;margin:0;color:var(--ink-strong);text-wrap:balance}
.where{margin-top:6px;color:var(--muted);font-size:13px}
.desc{margin:12px 0 0;font-size:15.5px}
.tip{margin-top:14px;padding:11px 13px;border-radius:14px;background:color-mix(in srgb,var(--day) 12%,var(--surface));font-size:14px}
.tip b{color:var(--ink-strong)}
.warn{background:color-mix(in srgb,#e08a1e 18%,var(--surface))}
.route{margin-top:14px;display:flex;flex-direction:column;gap:0}
.rs{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:stretch}
.rs .rail{display:flex;flex-direction:column;align-items:center}
.rs .dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3.5px solid var(--fg);margin-top:3px;flex:none}
.rs .bar{flex:1;width:6px;border-radius:3px;min-height:34px;margin-block:2px}
.rs .bar.walk{background:repeating-linear-gradient(var(--muted) 0 4px,transparent 4px 8px);width:3px}
.rs .st{font-weight:700;color:var(--ink-strong)}
.rs .ln{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin:6px 0 2px}
.rs .di{font-size:12.5px;color:var(--muted);padding-bottom:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.act{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;padding:12px;border-radius:14px;background:var(--chip);color:var(--fg)}
.act.primary{background:var(--day);color:#fff}
.act svg{width:18px;height:18px}

/* barra inferior */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 28%)}
.navin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.navbtn{all:unset;cursor:pointer;box-sizing:border-box;border-radius:16px;min-height:56px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.navbtn.next{background:var(--ink-strong);color:var(--bg);justify-content:space-between;padding:8px 14px 8px 16px;gap:10px;min-width:0}
.navbtn.next .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.navbtn.next .nm{font-family:var(--font-display);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.navbtn.next .tx{min-width:0;display:flex;flex-direction:column}
.navbtn[disabled]{opacity:.35;pointer-events:none}
.navbtn svg{width:22px;height:22px;flex:none}

/* lista del día */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(5,8,20,.5);display:flex;align-items:flex-end}
.sheet .panel{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;max-height:82%;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--font-display);font-weight:850;font-size:20px;margin:4px 0 10px;color:var(--ink-strong)}
.li{all:unset;cursor:pointer;display:grid;grid-template-columns:52px 14px 1fr;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.li .t{font-family:var(--font-display);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.li .d{width:12px;height:12px;border-radius:50%;border:3px solid var(--day);background:var(--surface)}
.li.leg .d{border-width:0;background:var(--line)}
.li .n{font-weight:600;min-width:0}
.li .n small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.li[aria-current="true"]{background:color-mix(in srgb,var(--day) 12%,transparent);border-radius:10px}
.listbtn{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--day);padding:4px 0}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.stop span{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="roundel" aria-hidden="true"><i></i><b></b></div>
      <h1>Londres en ruta</h1>
      <div class="sub">9–12 oct 2026<br>Base: Ilford</div>
    </div>
    <div class="days" role="tablist" id="days"></div>
    <div class="lineWrap" id="lineWrap"><div class="tube" id="tube"></div></div>
    <div class="meta"><span id="dayTitle"></span><button class="listbtn" id="openList" type="button">Ver el día ›</button></div>
  </header>
  <main id="main"></main>
</div>

<nav class="navbar"><div class="navin">
  <button class="navbtn" id="prev" type="button" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="navbtn next" id="next" type="button"><span class="tx"><span class="lbl" id="nextLbl">Siguiente</span><span class="nm" id="nextName"></span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="navbtn" id="listBtn" type="button" aria-label="Lista del día"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg></button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>

let state={d:0,i:0};
try{const s=JSON.parse(localStorage.getItem("ldn-pos")||"null"); if(s&&DAYS[s.d]&&DAYS[s.d].steps[s.i]) state=s;}catch(e){}
const h=(location.hash||"").replace("#","");
if(/^dia[1-4]$/.test(h)) state={d:+h[3]-1,i:0};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem("ldn-pos",JSON.stringify(state))}catch(e){}}

function mapsUrl(st){const q=encodeURIComponent((st.q||st.name)+" London");return `https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=transit`;}
function photosUrl(st){return `https://www.google.com/search?tbm=isch&q=${encodeURIComponent((st.q||st.name)+" London")}`;}

function routeHTML(r){
  let out="";
  for(let k=0;k<r.length;k++){
    const [type,txt]=r[k];
    if(type==="s"){
      const nxt=r[k+1];
      let bar="";
      if(nxt){ if(nxt[0]==="walk") bar='<div class="bar walk"></div>'; else if(nxt[0]!=="s") bar=`<div class="bar" style="background:${LN[nxt[0]][1]}"></div>`; }
      const seg = nxt && nxt[0]!=="s" ? (nxt[0]==="walk" ? `<div class="di">🚶 ${nxt[1]}</div>` : `<span class="ln" style="background:${LN[nxt[0]][1]};color:${LN[nxt[0]][2]}">${LN[nxt[0]][0]}</span><div class="di">${nxt[1]||""}</div>`) : "";
      out+=`<div class="rs"><div class="rail"><span class="dot"></span>${bar}</div><div><div class="st">${txt}</div>${seg}</div></div>`;
    }
  }
  return `<div class="route">${out}</div>`;
}

function render(){
  const D=DAYS[state.d], st=D.steps[state.i];
  document.documentElement.style.setProperty("--day",D.color);
  // días
  $("days").innerHTML=DAYS.map((x,j)=>`<button role="tab" type="button" aria-selected="${j===state.d}" style="--d:${x.color}" data-d="${j}"><span class="w">${x.w}</span><span class="n">${x.n}</span></button>`).join("");
  // línea
  $("tube").innerHTML=D.steps.map((s,j)=>`<button class="stop ${s.k==="t"?"leg":""} ${j<state.i?"done":""}" type="button" data-i="${j}" aria-label="${s.t} ${s.name}" ${j===state.i?'aria-current="true"':""}><span></span></button>`).join("");
  const cur=$("tube").children[state.i]; if(cur) cur.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  $("dayTitle").innerHTML=`<b>${D.title}</b> · ${state.i+1}/${D.steps.length}`;
  // tarjeta
  const [c1,c2]=SC[st.c]||SC.tube;
  const isLeg=st.k==="t";
  $("main").innerHTML=`<article class="card fade">
   <div class="post" style="--c1:${c1};--c2:${c2}">${scene(st.c)}<span class="time">${st.t}</span><span class="cat">${CATNAME[st.c]||""}</span><span class="stamp">${D.w} ${D.n} oct · Londres</span></div>
   <div class="body"><h2>${st.name}</h2>${st.where?`<div class="where">${st.where}</div>`:""}
   <p class="desc">${st.desc}</p>
   ${st.tip?`<div class="tip">${st.tip}</div>`:""}
   ${st.route?routeHTML(st.route):""}
   ${!isLeg||st.q?`<div class="actions">
     <a class="act primary" href="${mapsUrl(st)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Cómo llegar</a>
     <a class="act" href="${photosUrl(st)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>Ver fotos</a></div>`:""}
   </div></article>`;
  // navegación
  const nextStep=D.steps[state.i+1];
  $("prev").disabled = state.d===0 && state.i===0;
  if(nextStep){ $("nextLbl").textContent=`Siguiente · ${nextStep.t}`; $("nextName").textContent=nextStep.name; $("next").disabled=false; }
  else if(state.d<DAYS.length-1){ $("nextLbl").textContent="Siguiente día"; $("nextName").textContent=`${DAYS[state.d+1].w} ${DAYS[state.d+1].n} · ${DAYS[state.d+1].title}`; $("next").disabled=false; }
  else { $("nextLbl").textContent="Fin del viaje"; $("nextName").textContent="¡Buen vuelo! ✈"; $("next").disabled=true; }
  save();
}
function go(d,i){state={d,i};render();window.scrollTo({top:0,behavior:"smooth"});}
function next(){const D=DAYS[state.d]; if(state.i<D.steps.length-1) go(state.d,state.i+1); else if(state.d<DAYS.length-1) go(state.d+1,0);}
function prev(){ if(state.i>0) go(state.d,state.i-1); else if(state.d>0) go(state.d-1,DAYS[state.d-1].steps.length-1);}

$("days").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) go(+b.dataset.d,0);});
$("tube").addEventListener("click",e=>{const b=e.target.closest(".stop"); if(b) go(state.d,+b.dataset.i);});
$("next").addEventListener("click",next); $("prev").addEventListener("click",prev);
document.addEventListener("keydown",e=>{ if($("sheet").hidden){ if(e.key==="ArrowRight") next(); if(e.key==="ArrowLeft") prev(); } else if(e.key==="Escape") $("sheet").hidden=true; });
// deslizar
let sx=null,sy=null;
$("main").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("main").addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ dx<0?next():prev(); } sx=null; },{passive:true});
// lista
function openList(){
  const D=DAYS[state.d];
  $("panel").innerHTML=`<h3>${D.w} ${D.n} · ${D.title}</h3>`+D.steps.map((s,j)=>`<button class="li ${s.k==="t"?"leg":""}" type="button" data-i="${j}" ${j===state.i?'aria-current="true"':""}><span class="t">${s.t}</span><span class="d"></span><span class="n">${s.name}<small>${s.where||""}</small></span></button>`).join("");
  $("sheet").hidden=false;
}
$("openList").addEventListener("click",openList); $("listBtn").addEventListener("click",openList);
$("sheet").addEventListener("click",e=>{ const b=e.target.closest(".li"); if(b){ $("sheet").hidden=true; go(state.d,+b.dataset.i); } else if(e.target===$("sheet")) $("sheet").hidden=true; });
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>

</body>
</html>
