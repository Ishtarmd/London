<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Londres en ruta</title>
<meta name="theme-color" content="#0d1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Londres">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una pantalla con pestañas inferiores (Ruta · Mapa · Gastos · Info); la Ruta es una "línea de metro" de paradas con tarjeta-postal y botón Siguiente */
:root{
  --bg:#eef1f6; --surface:#ffffff; --fg:#14182a; --muted:#5b6378; --line:#d9dee8; --chip:#e3e8f1;
  --ink-strong:#0d1530; --accent:#dc241f; --day:#dc241f; --ok:#0f8a6a; --warn:#c96a00; --rain:#2b6fd6;
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 10px 30px -14px rgba(16,24,48,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#151b30; --fg:#e8ecf6; --muted:#9aa3bb; --line:#262e48; --chip:#1f2741; --ink-strong:#ffffff; --ok:#2fbf8f; --warn:#f0a040; --rain:#6aa6ff; --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020; --surface:#151b30; --fg:#e8ecf6; --muted:#9aa3bb; --line:#262e48; --chip:#1f2741; --ink-strong:#ffffff; --ok:#2fbf8f; --warn:#f0a040; --rain:#6aa6ff; --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}

/* cabecera */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px}
.roundel{width:28px;height:28px;flex:none;position:relative}
.roundel i{position:absolute;inset:0;border:6px solid var(--accent);border-radius:50%}
.roundel b{position:absolute;left:-3px;right:-3px;top:50%;height:8px;margin-top:-4px;background:var(--ink-strong);border-radius:1px}
.brand h1{font-family:var(--font-display);font-stretch:85%;font-weight:850;font-size:21px;letter-spacing:-.01em;margin:0;color:var(--ink-strong)}
.nowbtn{all:unset;cursor:pointer;margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;background:var(--ink-strong);color:var(--bg)}
.nowbtn i{width:8px;height:8px;border-radius:50%;background:#2fdc8a;box-shadow:0 0 0 3px rgba(47,220,138,.25)}
.count{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 12px;border-radius:12px;background:var(--chip)}
.count b{color:var(--ink-strong)}
.count .em{font-size:15px}
.count.soon{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.days button{all:unset;cursor:pointer;text-align:center;padding:6px 2px 7px;border-radius:12px;background:var(--chip);color:var(--fg);border-bottom:4px solid transparent}
.days button .w{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.days button .n{display:block;font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.1}
.days button .wx{display:block;font-size:11px;color:var(--muted);min-height:15px;font-variant-numeric:tabular-nums}
.days button[aria-selected="true"]{background:var(--d);color:#fff;border-bottom-color:rgba(0,0,0,.25)}
.days button[aria-selected="true"] .w,.days button[aria-selected="true"] .wx{color:rgba(255,255,255,.88)}
:is(button,a,input,select):focus-visible{outline:3px solid var(--day);outline-offset:2px}

.lineWrap{overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-block:5px 3px}
.lineWrap::-webkit-scrollbar{display:none}
.tube{position:relative;display:flex;min-width:max-content;padding-inline:4px}
.tube:before{content:"";position:absolute;left:10px;right:10px;top:50%;height:6px;margin-top:-3px;background:var(--day);border-radius:3px;opacity:.9}
.stop{all:unset;cursor:pointer;position:relative;width:26px;height:22px;display:grid;place-items:center}
.stop span{width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--day);transition:transform .2s}
.stop.leg span{width:6px;height:6px;border-width:0;background:rgba(255,255,255,.85)}
.stop.done span{background:var(--day)}
.stop.now:after{content:"";position:absolute;bottom:-5px;width:5px;height:5px;border-radius:50%;background:#2fdc8a}
.stop[aria-current="true"] span{transform:scale(1.55);background:#fff;box-shadow:0 0 0 3px var(--bg)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:2px}
.meta b{color:var(--fg)}
.listbtn{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--day);white-space:nowrap}

main{flex:1;padding-block:8px 170px}
.view[hidden]{display:none}

/* tarjeta */
.card{background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.post{position:relative;aspect-ratio:16/10;max-width:100%;color:#fff;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2))}
.post svg.scene{position:absolute;inset:0;width:100%;height:100%}
.post img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post.has-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 35%,transparent 65%,rgba(0,0,0,.45));pointer-events:none}
.post .time,.post .cat,.post .stamp,.post .wxc{z-index:2}
.post .time{position:absolute;left:14px;top:14px;font-family:var(--font-display);font-weight:800;font-size:15px;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.post .cat{position:absolute;right:14px;top:14px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.2);padding:5px 10px;border-radius:999px}
.post .wxc{position:absolute;right:14px;bottom:12px;font-size:12px;font-weight:700;background:rgba(0,0,0,.3);padding:4px 9px;border-radius:999px}
.post .stamp{position:absolute;left:14px;bottom:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.92;font-weight:600}
.body{padding:16px 18px 20px}
.titleRow{display:flex;align-items:flex-start;gap:10px}
.body h2{flex:1;min-width:0;font-family:var(--font-display);font-stretch:90%;font-weight:850;font-size:26px;line-height:1.05;letter-spacing:-.015em;margin:0;color:var(--ink-strong);text-wrap:balance}
.visit{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:999px;border:2px solid var(--line);color:var(--muted)}
.visit svg{width:15px;height:15px}
.visit.on{background:var(--ok);border-color:var(--ok);color:#fff}
.where{margin-top:6px;color:var(--muted);font-size:13px}
.desc{margin:12px 0 0;font-size:15.5px}
.box{margin-top:12px;padding:11px 13px;border-radius:14px;font-size:14px}
.tip{background:color-mix(in srgb,var(--day) 12%,var(--surface))}
.late{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.late b,.tip b,.planb b{color:var(--ink-strong)}
.planb{background:color-mix(in srgb,var(--rain) 14%,var(--surface))}
details.planb summary{cursor:pointer;font-weight:700;list-style:none}
details.planb summary::-webkit-details-marker{display:none}
details.planb p{margin:6px 0 0}
.eat{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.eat h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eat a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;color:var(--fg);padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.eat a:last-child{border-bottom:none}
.eat a span{color:var(--muted);font-size:12.5px;text-align:right}
.route{margin-top:14px;display:flex;flex-direction:column}
.rs{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:stretch}
.rs .rail{display:flex;flex-direction:column;align-items:center}
.rs .dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3.5px solid var(--fg);margin-top:3px;flex:none}
.rs .bar{flex:1;width:6px;border-radius:3px;min-height:34px;margin-block:2px}
.rs .bar.walk{background:repeating-linear-gradient(var(--muted) 0 4px,transparent 4px 8px);width:3px}
.rs .st{font-weight:700;color:var(--ink-strong)}
.rs .ln{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin:6px 0 2px}
.rs .di{font-size:12.5px;color:var(--muted);padding-bottom:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.act{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;padding:12px;border-radius:14px;background:var(--chip);color:var(--fg);border:0;cursor:pointer}
.act.primary{background:var(--day);color:#fff}
.act svg{width:18px;height:18px}

/* barras inferiores */
.navbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:6;padding:12px 16px 8px;background:linear-gradient(transparent,var(--bg) 30%)}
.navin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.navbtn{all:unset;cursor:pointer;box-sizing:border-box;border-radius:16px;min-height:52px;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.navbtn.next{background:var(--ink-strong);color:var(--bg);justify-content:space-between;padding:6px 14px 6px 16px;gap:10px;min-width:0}
.navbtn.next .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.navbtn.next .nm{font-family:var(--font-display);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.navbtn.next .tx{min-width:0;display:flex;flex-direction:column}
.navbtn[disabled]{opacity:.35;pointer-events:none}
.navbtn svg{width:22px;height:22px;flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabsin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{all:unset;cursor:pointer;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--day)}

/* lista del día */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(5,8,20,.5);display:flex;align-items:flex-end}
.sheet .panel{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;max-height:82%;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--font-display);font-weight:850;font-size:20px;margin:4px 0 10px;color:var(--ink-strong)}
.li{all:unset;cursor:pointer;display:grid;grid-template-columns:52px 14px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.li .t{font-family:var(--font-display);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.li .d{width:12px;height:12px;border-radius:50%;border:3px solid var(--day);background:var(--surface)}
.li.done .d{background:var(--day)}
.li.leg .d{border-width:0;background:var(--line)}
.li .n{font-weight:600;min-width:0}
.li .n small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.li .ok{color:var(--ok);font-weight:800}
.li[aria-current="true"]{background:color-mix(in srgb,var(--day) 12%,transparent);border-radius:10px}

/* secciones genéricas */
.sec{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.sec h3{font-family:var(--font-display);font-weight:850;font-size:19px;margin:0 0 10px;color:var(--ink-strong)}
.sec h4{margin:12px 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}

/* mapa */
#map{height:calc(100dvh - 330px);min-height:320px;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:var(--chip)}
.mapbar{display:flex;gap:8px;margin-top:10px}
.mapbar button{flex:1}
.pin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 12px var(--font-display);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.done{opacity:.55}
.me{width:16px;height:16px;border-radius:50%;background:#2b7cff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(43,124,255,.25)}
.maplist a{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.maplist .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 12px var(--font-display);flex:none}

/* gastos */
.people{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:5px 6px 5px 12px;font-weight:600;font-size:14px}
.pchip button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
.f input,.f select{font:inherit;font-size:15px;font-weight:500;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 11px;width:100%;box-sizing:border-box;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.split{display:flex;flex-wrap:wrap;gap:6px}
.split label{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.btn{all:unset;cursor:pointer;text-align:center;font-weight:800;padding:12px 14px;border-radius:14px;background:var(--ink-strong);color:var(--bg)}
.btn.sec2{background:var(--chip);color:var(--fg)}
.exp{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.exp .c{min-width:0}
.exp .c small{display:block;color:var(--muted);font-size:12px}
.exp .a{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.exp .a small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.exp button{all:unset;cursor:pointer;color:var(--muted);padding:4px}
.bal{display:flex;justify-content:space-between;padding:7px 0;font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line)}
.pos{color:var(--ok);font-weight:800}.neg{color:var(--accent);font-weight:800}
.transfer{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ok) 12%,var(--surface));margin-top:6px;font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* info */
.addr{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.15;color:var(--ink-strong);user-select:all}
.res{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.res .w{font-family:var(--font-display);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;color:var(--day)}
.res .nm{font-weight:700}
.res input{grid-column:1/-1;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;padding:7px 10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.phr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.phr b{color:var(--ink-strong)}
.post img.wiki{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.post img.wiki.ok{opacity:1}
.post .credit{position:absolute;right:10px;bottom:36px;z-index:2;font-size:10px;color:#fff;opacity:.85;text-decoration:none;background:rgba(0,0,0,.3);padding:2px 7px;border-radius:999px}
.gal{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal button{all:unset;cursor:pointer;flex:none;width:76px;height:56px;border-radius:10px;overflow:hidden;background:var(--chip);outline-offset:2px}
.gal button img{width:100%;height:100%;object-fit:cover;display:block}
.gal button[aria-pressed="true"]{outline:3px solid var(--day)}
.notes{margin-top:12px}
.notes summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);list-style:none}
.notes summary::-webkit-details-marker{display:none}
.notes textarea{display:block;width:100%;box-sizing:border-box;margin-top:8px;min-height:72px;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.sweet{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.sweet .when{font-family:var(--font-display);font-weight:800;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sweet button{all:unset;cursor:pointer;font-weight:700;color:var(--ink-strong)}
.prog{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok);width:0}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.stop span{transition:none}}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink-strong);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;font-size:14px}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="roundel" aria-hidden="true"><i></i><b></b></div>
      <h1>Londres en ruta</h1>
      <button class="nowbtn" id="nowBtn" type="button"><i></i>Ahora</button>
    </div>
    <div class="count" id="count"></div>
    <div class="days" role="tablist" id="days"></div>
    <div id="routeHead">
      <div class="lineWrap"><div class="tube" id="tube"></div></div>
      <div class="meta"><span id="dayTitle"></span><button class="listbtn" id="openList" type="button">Ver el día ›</button></div>
    </div>
  </header>
  <main>
    <section class="view" id="v-ruta"></section>
    <section class="view" id="v-mapa" hidden>
      <div id="map"></div>
      <div class="mapbar"><button class="act primary" id="locate" type="button">📍 Mi ubicación</button><button class="act" id="fitDay" type="button">Ver todo el día</button></div>
      <p class="small muted" id="mapNote"></p>
      <div class="sec maplist" id="mapList"></div>
    </section>
    <section class="view" id="v-gastos" hidden></section>
    <section class="view" id="v-info" hidden></section>
  </main>
</div>

 {t:"11:20",c:"museum",name:"Natural History Museum",where:"South Kensington · gratis",desc:"Una catedral victoriana llena de dinosaurios. En la Hintze Hall cuelga el esqueleto de una ballena azul, y hay sala de volcanes y simulador de terremotos.",tip:"Gratis, pero reservad franja online (~11:15–11:30) para entrar sin cola.",q:"Natural History Museum London"},
 {t:"12:50",c:"shop",name:"Harrods",where:"Knightsbridge · 10 min a pie del museo",desc:"Los grandes almacenes más famosos del mundo. No os perdáis los Food Halls, la escalera egipcia ni la planta de juguetes.",tip:"Evitad mochilas grandes.",q:"Harrods London"},
 {t:"13:40",c:"houses",name:"Chelsea · King's Road",where:"Sloane Square",desc:"El barrio elegante: Sloane Street, Sloane Square y King's Road, con callejuelas de casitas de colores.",tip:"Los sábados hay mercado de comida en <b>Duke of York Square</b>, junto a Sloane Square: buen sitio para comer.",q:"King's Road Chelsea"},
 {t:"14:35",c:"sweets",name:"Peggy Porschen",where:"116 Ebury Street, Belgravia · de camino a Victoria",desc:"La pastelería rosa más fotografiada de Londres, con la fachada cubierta de flores. Tartas, cupcakes y bebidas decoradas en tonos pastel.",tip:"Los fines de semana hay cola para sentarse: pedid para llevar. Está de camino a la estación de Victoria.",q:"Peggy Porschen Belgravia"},
 {t:"15:00",c:"tube",k:"t",name:"Hacia Wembley",where:"~40 min",desc:"Victoria line una parada y la Jubilee directa hasta el estadio.",tip:"Llegad 15–20 min antes de vuestra hora a Mundo Pixar.",route:[["s","Peggy Porschen"],["walk","8 min"],["s","Victoria"],["victoria","dir. Walthamstow · 1 parada"],["s","Green Park"],["jubilee","dir. Stanmore · ~22 min"],["s","Wembley Park"]]},
 {t:"15:55",c:"bigben",name:"Estadio de Wembley",where:"Wembley Way · a 5 min de la estación",desc:"Bajando por Wembley Way aparece el estadio de la selección inglesa, con su arco blanco de 133 m. Foto rápida antes de Pixar.",q:"Wembley Stadium"},
 {t:"16:30",c:"balloon",name:"Mundo Pixar Experience",where:"Fulton Rd, Wembley Park · 5 min de la estación",desc:"La exposición inmersiva de Pixar más grande del mundo: 14 universos a tamaño real, del cuarto de Andy al Monstruos S.A., con olores y música en cada sala. Se recorre en 45–55 min.",tip:"<b>Sesión de las 16:30 del sábado.</b> Solo se vende online.",q:"Mundo Pixar Experience Wembley"},
 {t:"17:30",c:"tube",k:"t",name:"De Wembley a Abbey Road",where:"~15 min",desc:"Directos en la Jubilee, sin transbordos.",route:[["s","Wembley Park"],["jubilee","dir. Stratford · 5 paradas · ~12 min"],["s","St John's Wood"],["walk","6 min por Grove End Road"],["s","Abbey Road"]]},
 {t:"17:50",c:"crossing",name:"Abbey Road",where:"St John's Wood · paso de cebra de los Beatles",desc:"El paso de cebra de la portada del disco <i>Abbey Road</i> (1969). Al lado están los estudios donde grabaron los Beatles, y en el muro de la entrada la gente deja mensajes escritos.",tip:"Es una calle con tráfico real: haced la foto por turnos y sin pararos en medio. Los estudios no se visitan por dentro.",q:"Abbey Road crossing"},
 {t:"18:05",c:"tube",k:"t",name:"Paseo hasta Camden",where:"~35 min a pie pasando por Primrose Hill",desc:"Se va andando por calles residenciales y se cruza Primrose Hill, con el skyline de Londres a la vista.",tip:"Si llueve o vais cansados: bus o Uber hasta Camden Town (~10 min).",route:[["s","Abbey Road"],["walk","~20 min"],["s","Primrose Hill"],["walk","~15 min"],["s","Camden Town"]]},
 {t:"18:20",c:"sunset",name:"Primrose Hill",where:"De camino a Camden",desc:"Una colina con todo el skyline de Londres delante: el Shard, la City y el BT Tower. Llegáis justo para el atardecer (~18:20).",q:"Primrose Hill viewpoint"},
 {t:"18:45",c:"market",name:"Camden Market",where:"Stables · Camden Lock · Buck Street",desc:"El Londres alternativo: ropa vintage y punk en antiguos establos de caballos, el callejón de los paraguas y la estatua de Amy Winehouse.",tip:"Los puestos de ropa cierran sobre las 18:00–19:00, así que id primero a lo que más os interese. La comida y los bares siguen abiertos.",q:"Stables Market Camden"},
 {t:"19:25",c:"sweets",name:"Hansel & Gretel y Regent's Canal",where:"Camden Lock",desc:"Una tienda de dulces de cuento y, al lado, el canal con barcazas pintadas y la esclusa de Camden Lock.",q:"Camden Lock"},
 {t:"19:50",c:"food",name:"Poppies Fish & Chips",where:"Camden · Hawley Crescent",desc:"El fish & chips clásico del viaje, con decoración de los años 50.",q:"Poppies Fish and Chips Camden"},
 {t:"21:00",c:"pub",name:"The Hawley Arms",where:"Camden",desc:"Pub rockero mítico de Camden, al que iba Amy Winehouse. Ambiente joven los sábados.",tip:"Alternativa: The Good Mixer.",q:"The Hawley Arms Camden"},
 {t:"22:00",c:"night",name:"Camden de noche",where:"Camden High St · Chalk Farm Rd",desc:"Bares con música en directo y el canal iluminado. Sin prisa: los sábados el metro funciona toda la noche.",q:"Camden High Street"},

 {t:"10:00",c:"museum",name:"British Museum",where:"Bloomsbury · 20 min a pie · gratis",desc:"Dos millones de años de historia: la Piedra de Rosetta, las momias egipcias, los frisos del Partenón y el Gran Atrio con techo de cristal.",tip:"Abre a las 10:00. La franja gratis online ayuda a entrar antes.",q:"British Museum"},
 {t:"11:40",c:"shop",name:"Hamleys",where:"Regent Street · domingo de 12:00 a 18:00",desc:"La juguetería más antigua del mundo (1760): siete plantas con dependientes haciendo demostraciones, un mundo de LEGO y una planta entera de chuches.",tip:"Paseo desde el British Museum por Soho Square y Carnaby Street (~20 min). Si llegáis antes de las 12:00, empezad por Liberty.",q:"Hamleys Regent Street"},
 {t:"12:30",c:"shop",name:"Liberty y Carnaby Street",where:"Great Marlborough Street",desc:"Grandes almacenes de 1924 en un edificio de estilo Tudor con madera de barcos antiguos por dentro. Al lado, Carnaby Street, la calle de la moda de los años 60.",q:"Liberty London"},
 {t:"13:05",c:"food",name:"Comida en Kingly Court",where:"Junto a Carnaby Street",desc:"Un patio de tres plantas lleno de restaurantes de precio medio: hamburguesas, ramen, tacos, pizza…",q:"Kingly Court"},

 {t:"16:30",c:"wizard",name:"Warner Bros. Studio Tour",where:"The Making of Harry Potter · entrada 16:30",desc:"Los decorados reales de las películas: el Gran Comedor, el Callejón Diagon, el andén con el Expreso de Hogwarts y la maqueta gigante del castillo. Coincide con la temporada Dark Arts.",tip:"Llegad 20–30 min antes. Probad la cerveza de mantequilla. Calculad 3–3,5 h.",q:"Warner Bros Studio Tour London"},

 {t:"08:10",c:"food",name:"Beigel Bake",where:"159 Brick Lane · abierto 24 h",desc:"La panadería de bagels más famosa de Londres, abierta día y noche desde hace décadas. El de <b>salt beef</b> (ternera en salazón con mostaza y pepinillo) cuesta unas 7 £ y es una institución.",tip:"Hay cola pero va rápida: llevad el pedido pensado. Probad también un <i>Eccles cake</i> o el strudel de manzana.",q:"Beigel Bake Brick Lane"},
 {t:"08:35",c:"art",name:"Street art de Brick Lane y Shoreditch",where:"Brick Lane · Hanbury St · Fashion St",desc:"Las calles del East End están llenas de murales enormes que cambian continuamente. Pasad por Hanbury Street, Fashion Street y la nave victoriana de Old Spitalfields Market (a esta hora aún cerrado).",q:"Brick Lane street art"},

 {t:"10:35",c:"garden",name:"St Dunstan in the East",where:"A 5 min de la Torre · gratis",desc:"Un jardín dentro de una iglesia bombardeada en la Segunda Guerra Mundial, con enredaderas entre los arcos góticos. Un rincón muy bonito y poco conocido.",q:"St Dunstan in the East"},
 {t:"10:50",c:"sky",name:"The Garden at 120",where:"120 Fenchurch St · planta 15",desc:"Azotea con jardín, gratis y sin reserva, con vistas a la Torre, Tower Bridge, el Shard y el Walkie-Talkie. Sustituye al Sky Garden, que está agotado.",tip:"Si os sale una cancelación en <b>Horizon 22</b> (planta 58, el mirador gratis más alto), id allí.",q:"The Garden at 120 Fenchurch Street"},
 {t:"11:25",c:"sky",name:"Rascacielos y Leadenhall Market",where:"La City",desc:"Ruta entre el Gherkin, el edificio Lloyd's y el Cheesegrater hasta Leadenhall Market, el mercado victoriano que sale como Callejón Diagon en la primera peli de Harry Potter.",q:"Leadenhall Market"},

 {t:"12:55",c:"pub",name:"Ye Olde Cheshire Cheese",where:"Fleet Street",desc:"Pub reconstruido tras el Gran Incendio de 1666, con salas oscuras de madera por las que pasaron Dickens y otros escritores. Es de Samuel Smith's, de lo más barato del centro.",tip:"Pie o fish &amp; chips y pinta de despedida.",q:"Ye Olde Cheshire Cheese"},

const WXI=c=>c===0?"☀️":c<=2?"🌤️":c===3?"☁️":c<=48?"🌫️":c<=57?"🌦️":c<=67?"🌧️":c<=77?"🌨️":c<=82?"🌧️":"⛈️";
async function loadWeather(){
  try{
    const u="https://api.open-meteo.com/v1/forecast?latitude=51.51&longitude=-0.12&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=precipitation_probability,weathercode&timezone=Europe%2FLondon&start_date=2026-10-09&end_date=2026-10-12";

}
function wxDay(n){ if(!WX) return null; const k=WX.daily.time.indexOf(`2026-10-${String(n).padStart(2,"0")}`); if(k<0) return null; return {code:WX.daily.weathercode[k],max:Math.round(WX.daily.temperature_2m_max[k]),min:Math.round(WX.daily.temperature_2m_min[k]),rain:WX.daily.precipitation_probability_max[k]}; }
function wxAt(date){ if(!WX||!WX.hourly) return null; const key=`${date.getFullYear()}-10-${String(date.getDate()).padStart(2,"0")}T${String(date.getHours()).padStart(2,"0")}:00`; const k=WX.hourly.time.indexOf(key); if(k<0) return null; return {p:WX.hourly.precipitation_probability[k],code:WX.hourly.weathercode[k]}; }
function rainSoon(D){ if(!WX||!WX.hourly) return null; for(let hh=8;hh<=23;hh++){const w=wxAt(new Date(2026,9,D.n,hh,0)); if(w&&w.p>=60) return hh;} return null; }

/* ================== "ahora" y retrasos ================== */
function nowPos(){
  const now=londonNow();
  const all=[];DAYS.forEach((D,d)=>D.steps.forEach((s,i)=>all.push({d,i,s})));
  if(now<all[0].s.at) return {before:true,d:0,i:0};
  let cur=all[0]; for(const x of all){ if(x.s.at<=now) cur=x; }
  if(now>new Date(2026,9,13,1,0)) return {after:true,d:3,i:DAYS[3].steps.length-1};
  return cur;
}
function lateInfo(){
  const now=londonNow(), D=DAYS[state.d], nx=D.steps[state.i+1];
  if(!nx||now<D.steps[0].at) return null;
  const np=nowPos(); if(np.before||np.after||np.d!==state.d) return null;
  const gap=np.i-state.i; if(gap<1||gap>3||visited.has(D.steps[state.i].id)) return null;
  const late=now-nx.at; if(late<20*60000) return null;
  const skip=D.steps.slice(state.i+1).filter(s=>s.opt&&!visited.has(s.id)).map(s=>s.name);
  return {min:Math.round(late/60000),skip};
}

const IS_ART=false; // versión del enlace de Claude: allí no se pueden cargar fotos externas
const WAPI="https://en.wikipedia.org/w/api.php?format=json&origin=*&redirects=1&";
const BAD=/logo|map|plan|icon|flag|coat|arms_of|diagram|locator|location|\.svg|signature|seal|crest|wikidata|commons-logo|question_book/i;
const PH=LS.get("ldn-ph",{});
async function wikiPhotos(id){
  if(PH[id]!==undefined) return PH[id];
  const w=WT[id]; if(!w||IS_ART) return null;
  try{
    let title=Array.isArray(w)?null:w;
    if(!title){
      const r=await fetch(WAPI+"action=query&list=search&srlimit=3&srsearch="+encodeURIComponent(w[0])); const j=await r.json();
      const hit=(j.query&&j.query.search||[]).find(x=>x.title.toLowerCase().includes(w[1].toLowerCase()));
      if(!hit){PH[id]=null;LS.set("ldn-ph",PH);return null;} title=hit.title;
    }
    const [a,b]=await Promise.all([
      fetch(WAPI+"action=query&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=1000&titles="+encodeURIComponent(title)).then(r=>r.json()),
      fetch(WAPI+"action=query&generator=images&gimlimit=40&prop=imageinfo&iiprop=url|mime|size&iiurlwidth=900&titles="+encodeURIComponent(title)).then(r=>r.json())
    ]);
    const page=Object.values(a.query&&a.query.pages||{})[0]||{};
    const gal=Object.values(b.query&&b.query.pages||{}).map(p=>({t:p.title,i:(p.imageinfo||[])[0]})).filter(x=>x.i&&x.i.mime==="image/jpeg"&&x.i.width>=700&&x.i.width>=x.i.height*0.9&&!BAD.test(x.t)).map(x=>x.i.thumburl).slice(0,8);
    const main=page.thumbnail&&page.thumbnail.source;
    const list=[...new Set([main,...gal].filter(Boolean))];
    PH[id]=list.length?{page:page.fullurl||("https://en.wikipedia.org/wiki/"+encodeURIComponent(title)),list}:null;
    LS.set("ldn-ph",PH); return PH[id];
  }catch(e){ return undefined; } // sin conexión: no se guarda, se reintenta luego
}
function showPhotos(st,data){
  if(!data||DAYS[state.d].steps[state.i]!==st) return;
  const post=document.querySelector("#v-ruta .post"); if(!post||post.querySelector("img.wiki")) return;
  const img=document.createElement("img"); img.className="wiki"; img.alt=st.name; img.decoding="async";
  img.onload=()=>{img.classList.add("ok");post.classList.add("has-photo");}; img.onerror=()=>img.remove();
  img.src=data.list[0];
  post.insertBefore(img,post.querySelector("img.photo")||post.querySelector(".time"));
  const cr=document.createElement("a"); cr.className="credit"; cr.href=data.page; cr.target="_blank"; cr.rel="noopener"; cr.textContent="Foto: Wikimedia Commons"; post.appendChild(cr);
  if(data.list.length>1){
    const g=$("gal"); if(!g) return;
    g.innerHTML=data.list.map((u,k)=>`<button type="button" data-k="${k}" aria-pressed="${k===0}" aria-label="Foto ${k+1}"><img src="${u}" alt="" loading="lazy" onerror="this.parentNode.remove()"></button>`).join("");
    g.hidden=false;
    g.onclick=e=>{const b=e.target.closest("button"); if(!b) return; img.classList.remove("ok"); img.src=data.list[+b.dataset.k]; g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));};
  }
}
async function preloadPhotos(btn,out){
  const ids=[...new Set(DAYS.flatMap(D=>D.steps).filter(s=>s.k!=="t"&&WT[s.id]).map(s=>s.id))];
  let n=0, ok=0, imgs=0, fail=0;
  for(const id of ids){
    if(PH[id]===null) delete PH[id]; // reintentar los que no encontraron foto
    const d=await wikiPhotos(id);
    if(d===undefined) fail++;
    if(d){ ok++; const r=await Promise.all(d.list.slice(0,4).map(u=>new Promise(res=>{const i=new Image();i.onload=()=>res(1);i.onerror=()=>res(0);i.src=u;}))); imgs+=r.reduce((a,b)=>a+b,0); }
    n++; btn.textContent=`Descargando… ${n}/${ids.length}`;
  }
  btn.disabled=false;
  if(ok===0){ btn.textContent="Reintentar"; out.innerHTML=`<b>No se ha podido descargar ninguna foto.</b> Comprueba que tienes internet${fail?" (Wikipedia no responde)":""} y vuelve a intentarlo.`; return; }
  btn.textContent="Fotos guardadas ✓";
  out.innerHTML=`${ok} de ${ids.length} sitios con foto · ${imgs} fotos guardadas en el móvil.${fail?` ${fail} sitios fallaron: pulsa otra vez para reintentar.`:""}`;
  toast("Fotos guardadas para usar sin internet");
}

  if(!map){

  if(layer) layer.remove();
  layer=L.layerGroup().addTo(map);
  const lls=[]; n=0;
  pts.forEach(x=>{ n++; lls.push(x.s.ll);
    const ic=L.divIcon({className:"",html:`<div class="pin ${visited.has(x.s.id)?"done":""}" style="background:${D.color}">${n}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
    const m=L.marker(x.s.ll,{icon:ic}).addTo(layer);
    m.bindPopup(`<b>${x.s.t} · ${x.s.name}</b><br><a href="#" data-go="${x.i}">Ver en la ruta ›</a> · <a href="${mapsUrl(x.s)}" target="_blank" rel="noopener">Cómo llegar</a>`);
  });
  // tramo largo (Wembley / Watford) separado para no dibujar líneas engañosas
  const far=ll=>ll[1]<-0.25||ll[1]>-0.03; // Wembley/Watford y el hotel (Ilford) quedan fuera del zoom y de la línea
  let seg=[]; const segs=[];
  pts.forEach(x=>{ if(far(x.s.ll)){ if(seg.length){segs.push(seg);seg=[];} return; } seg.push(x.s.ll); }); if(seg.length) segs.push(seg);
  segs.forEach(sg=>{ if(sg.length>1) L.polyline(sg,{color:D.color,weight:4,opacity:.8,dashArray:"8 8"}).addTo(layer); });
  setTimeout(()=>{ map.invalidateSize(); const near=lls.filter(ll=>!far(ll)); map.fitBounds(L.latLngBounds(near.length?near:lls),{padding:[30,30]}); },60);
}
function locate(){
  if(!navigator.geolocation){toast("Ubicación no disponible");return;}
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];
    if(meMarker) meMarker.remove();
    meMarker=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);
    map.setView(ll,15);
  },()=>toast("Activa la ubicación para esta app"),{enableHighAccuracy:true,timeout:10000});
}

/* ================== gastos ================== */
let G2=LS.get("ldn-gastos",{people:["Yo","Acompañante"],items:[],rate:1.15,rateDate:null});
function saveG(){LS.set("ldn-gastos",G2);}
async function loadRate(){
  try{const r=await fetch("https://api.frankfurter.app/latest?from=GBP&to=EUR"); if(!r.ok) return; const j=await r.json(); if(j.rates&&j.rates.EUR){G2.rate=+j.rates.EUR.toFixed(4);G2.rateDate=j.date;saveG(); if(view==="gastos") renderGastos();}}catch(e){}
}
const gbp=it=>it.cur==="GBP"?it.amt:it.amt/G2.rate;
const f2=x=>x.toFixed(2).replace(".",",");
function settle(){
  const bal={}; G2.people.forEach(p=>bal[p]=0);
  G2.items.forEach(it=>{const v=gbp(it); const sh=it.split.filter(p=>p in bal); if(!sh.length) return; if(it.by in bal) bal[it.by]+=v; sh.forEach(p=>bal[p]-=v/sh.length);});
  const cred=Object.entries(bal).filter(e=>e[1]>0.005).map(e=>[e[0],e[1]]).sort((a,b)=>b[1]-a[1]);
  const debt=Object.entries(bal).filter(e=>e[1]<-0.005).map(e=>[e[0],-e[1]]).sort((a,b)=>b[1]-a[1]);
  const tr=[]; let i=0,j=0; while(i<debt.length&&j<cred.length){const v=Math.min(debt[i][1],cred[j][1]); tr.push([debt[i][0],cred[j][0],v]); debt[i][1]-=v; cred[j][1]-=v; if(debt[i][1]<0.005)i++; if(cred[j][1]<0.005)j++;}
  return {bal,tr};
}
function renderGastos(){
  const total=G2.items.reduce((a,it)=>a+gbp(it),0);

    <p class="small muted" style="margin:8px 0 0">1 £ = ${String(G2.rate).replace(".",",")} €${G2.rateDate?` (cambio del ${G2.rateDate})`:" (aprox.; se actualiza con internet)"}</p>
  </div>
  <div class="sec"><h3>Quiénes vais</h3>
    <div class="people">${G2.people.map((p,k)=>`<span class="pchip">${esc(p)}<button type="button" data-delp="${k}" aria-label="Quitar ${esc(p)}">✕</button></span>`).join("")}</div>
    <div class="row2" style="margin-top:10px"><label class="f">Nombre<input id="pName" placeholder="Ej. Lucía" autocomplete="off"></label><button class="btn sec2" id="addP" type="button" style="align-self:end">Añadir</button></div>
  </div>
  <form class="sec stack" id="gForm"><h3 style="margin:0">Nuevo gasto</h3>
    <label class="f">Concepto<input id="gC" placeholder="Ej. Cena en Poppies" required autocomplete="off"></label>
    <div class="row2"><label class="f">Importe<input id="gA" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00" required></label>
    <label class="f">Moneda<select id="gCur"><option value="GBP">£ libras</option><option value="EUR">€ euros</option></select></label></div>
    <label class="f">Pagó<select id="gBy">${opts}</select></label>
    <div class="f">Entre quiénes se reparte<div class="split" id="gSplit">${G2.people.map(p=>`<label><input type="checkbox" value="${esc(p)}" checked> ${esc(p)}</label>`).join("")}</div></div>
    <button class="btn" type="submit">Añadir gasto</button>
  </form>
  <div class="sec"><h3>Cuentas</h3>
    ${G2.people.map(p=>`<div class="bal"><span>${esc(p)}</span><span class="${bal[p]>=0?"pos":"neg"}">${bal[p]>=0?"+":"−"}£${f2(Math.abs(bal[p]||0))}</span></div>`).join("")}
    ${tr.length?tr.map(t=>`<div class="transfer">${esc(t[0])} → ${esc(t[1])}: <b>£${f2(t[2])}</b> (${f2(t[2]*G2.rate)} €)</div>`).join(""):`<p class="empty">Todo cuadrado por ahora.</p>`}
    <button class="btn sec2" id="copyG" type="button" style="display:block;margin-top:12px">Copiar resumen</button>
  </div>
  <div class="sec"><h3>Historial</h3>${G2.items.length?G2.items.slice().reverse().map(it=>`<div class="exp"><div class="c"><b>${esc(it.c)}</b><small>Pagó ${esc(it.by)} · entre ${it.split.length} · ${it.d}</small></div><div class="a">${it.cur==="GBP"?"£":""}${f2(it.amt)}${it.cur==="EUR"?" €":""}<small>${it.cur==="GBP"?f2(it.amt*G2.rate)+" €":"£"+f2(it.amt/G2.rate)}</small></div><button type="button" data-delg="${it.id}" aria-label="Borrar">✕</button></div>`).join(""):`<p class="empty">Aún no hay gastos. Añade el primero con el formulario de arriba.</p>`}
    <p class="small muted">Los gastos se guardan solo en este móvil. Si los apunta una sola persona, las cuentas salen bien para todos.</p></div>`;
  $("addP").onclick=()=>{const v=$("pName").value.trim(); if(v&&!G2.people.includes(v)){G2.people.push(v);saveG();renderGastos();}};
  $("v-gastos").querySelectorAll("[data-delp]").forEach(b=>b.onclick=()=>{ if(G2.people.length<=1) return; G2.people.splice(+b.dataset.delp,1); saveG(); renderGastos(); });
  $("v-gastos").querySelectorAll("[data-delg]").forEach(b=>b.onclick=()=>{ G2.items=G2.items.filter(x=>x.id!==b.dataset.delg); saveG(); renderGastos(); });
  $("gForm").onsubmit=e=>{e.preventDefault(); const amt=parseFloat(String($("gA").value).replace(",",".")); if(!(amt>0)) return;
    const split=[...$("gSplit").querySelectorAll("input:checked")].map(x=>x.value); if(!split.length){toast("Elige al menos una persona");return;}
    const now=londonNow(); G2.items.push({id:String(Date.now()),c:$("gC").value.trim(),amt,cur:$("gCur").value,by:$("gBy").value,split,d:`${now.getDate()}/${now.getMonth()+1} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`});
    saveG(); renderGastos(); toast("Gasto añadido"); };
  $("copyG").onclick=async()=>{ const txt=`Gastos Londres: total £${f2(total)} (${f2(total*G2.rate)} €)\n`+(tr.length?tr.map(t=>`${t[0]} → ${t[1]}: £${f2(t[2])} (${f2(t[2]*G2.rate)} €)`).join("\n"):"Todo cuadrado"); try{await navigator.clipboard.writeText(txt);toast("Resumen copiado");}catch(e){toast("No se pudo copiar");} };
}

  <div class="sec"><h3>🗣️ Frases útiles</h3>

/* ================== navegación ================== */
function renderAll(){
  const D=DAYS[state.d];
  document.documentElement.style.setProperty("--day",D.color);
  renderCount(); renderDays(); renderTube();
  $("routeHead").hidden = !(view==="ruta");
  $("navbar").hidden = view!=="ruta";
  ["ruta","mapa","gastos","info"].forEach(v=>$("v-"+v).hidden=v!==view);
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===view));
  if(view==="ruta") renderRoute(); else if(view==="mapa") renderMap(); else if(view==="gastos") renderGastos(); else renderInfo();
  save();
}
function go(d,i){state={d,i};if(view!=="ruta"&&view!=="mapa")view="ruta";renderAll();window.scrollTo({top:0,behavior:"smooth"});}
function next(){const D=DAYS[state.d]; if(state.i<D.steps.length-1) go(state.d,state.i+1); else if(state.d<DAYS.length-1) go(state.d+1,0);}
function prev(){ if(state.i>0) go(state.d,state.i-1); else if(state.d>0) go(state.d-1,DAYS[state.d-1].steps.length-1);}

$("days").addEventListener("click",e=>{const b=e.target.closest("button"); if(b){state={d:+b.dataset.d,i:0};renderAll();}});
$("tube").addEventListener("click",e=>{const b=e.target.closest(".stop"); if(b) go(state.d,+b.dataset.i);});
$("next").onclick=next; $("prev").onclick=prev;
$("nowBtn").onclick=()=>{ const p=nowPos(); view="ruta"; go(p.d,p.i); toast(p.before?`Faltan ${fmtDur(DAYS[0].steps[0].at-londonNow())} para empezar`:p.after?"El viaje ya terminó":"Esto es lo que toca ahora"); };
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab"); if(b){view=b.dataset.v;renderAll();window.scrollTo({top:0});}});
$("locate").onclick=locate; $("fitDay").onclick=()=>renderMap();
document.addEventListener("click",e=>{const a=e.target.closest("[data-go]"); if(a){e.preventDefault(); view="ruta"; go(state.d,+a.dataset.go);}});
document.addEventListener("keydown",e=>{ if(!$("sheet").hidden){ if(e.key==="Escape") $("sheet").hidden=true; return;} if(view!=="ruta"||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return; if(e.key==="ArrowRight") next(); if(e.key==="ArrowLeft") prev(); });
let sx=null,sy=null;
$("v-ruta").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("v-ruta").addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ dx<0?next():prev(); } sx=null; },{passive:true});
function openList(){
  const D=DAYS[state.d];
  $("panel").innerHTML=`<h3>${D.w} ${D.n} · ${D.title}</h3>`+D.steps.map((s,j)=>`<button class="li ${s.k==="t"?"leg":""} ${visited.has(s.id)?"done":""}" type="button" data-i="${j}" ${j===state.i?'aria-current="true"':""}><span class="t">${s.t}</span><span class="d"></span><span class="n">${s.name}<small>${s.where||""}${s.opt?" · opcional":""}</small></span><span class="ok">${visited.has(s.id)?"✓":""}</span></button>`).join("");
  $("sheet").hidden=false;
}
$("openList").onclick=openList; $("listBtn").onclick=openList;
$("sheet").addEventListener("click",e=>{ const b=e.target.closest(".li"); if(b){ $("sheet").hidden=true; go(state.d,+b.dataset.i); } else if(e.target===$("sheet")) $("sheet").hidden=true; });

renderAll();
setInterval(()=>{renderCount(); if(view==="ruta") renderTube();},30000);
loadWeather(); loadRate();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
